    <style>
      :root {
        --hero-dim: 0.28;
      }

      html {
        scroll-behavior: smooth;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F8F4E3; /* Ivory */
        color: #1D2D50; /* Deep Royal Blue */
        overflow-x: hidden;
      }

      .font-serif-heading {
        font-family: 'Merriweather', serif;
      }

      .font-scripture {
        font-family: 'EB Garamond', serif;
      }

      /* Hero Visual Visibility & Dimming Optimization */
      .hero-overlay {
        background: linear-gradient(180deg,
          rgba(8,6,10, calc(var(--hero-dim) * 0.6)) 0%,
          rgba(8,6,10, calc(var(--hero-dim) * 0.2)) 40%,
          rgba(8,6,10, calc(var(--hero-dim) * 0.9)) 78%,
          rgba(11,13,18, 0.92) 100%);
      }

      .hero-scrim {
        background: radial-gradient(ellipse at center, rgba(8,6,10,0.55), rgba(8,6,10,0.25) 70%, transparent);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.25rem 0.875rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        background-color: #4A152C;
        color: #E8C96A;
        border: 1px solid rgba(212, 175, 55, 0.4);
      }

      .btn-gold {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 0.75rem;
        background-color: #D4AF37;
        color: #1A0812;
        font-weight: 800;
        box-shadow: 0 4px 14px 0 rgba(212, 175, 55, 0.35);
        transition: all 0.2s ease;
      }
      .btn-gold:hover {
        background-color: #E8C96A;
        transform: translateY(-1px);
      }

      .btn-red {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 0.75rem;
        background-color: #DC2626;
        color: #FFFFFF;
        font-weight: 700;
        border: 1px solid rgba(248, 113, 113, 0.4);
        box-shadow: 0 4px 14px 0 rgba(220, 38, 38, 0.3);
        transition: all 0.2s ease;
      }
      .btn-red:hover {
        background-color: #EF4444;
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 0.75rem;
        background-color: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
        color: #FFFFFF;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.2s ease;
      }
      .btn-ghost:hover {
        background-color: rgba(0, 0, 0, 0.65);
        color: #E8C96A;
      }

      .hero-content {
        background: radial-gradient(ellipse at center, rgba(8,6,10,0.55) 0%, transparent 70%);
        padding: 2rem;
      }

      /* Center Alignment Across Site */
      main, section, article, header, footer {
        text-align: center;
      }
      .prose, .manuscript {
        text-align: center;
      }
      .prose ul, .prose ol {
        list-style-position: inside;
        padding-left: 0;
      }
      .prose li {
        text-align: center;
      }
      table {
        margin-inline: auto;
      }
      th, td {
        text-align: center;
        vertical-align: middle;
      }

      /* Custom Scrollbar for the encyclopedia feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F8F4E3; 
      }
      ::-webkit-scrollbar-thumb {
        background: #D4AF37; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b5952f; 
      }

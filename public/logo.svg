<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan-to-blue gradient matching the original logo -->
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008ef0" />
      <stop offset="50%" stop-color="#00d8f0" />
      <stop offset="100%" stop-color="#00f5df" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5df" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#008ef0" stop-opacity="0.2" />
    </linearGradient>

    <!-- Paths for the text to follow -->
    <!-- Top Arc: left to right over the top -->
    <path id="topArcPath" d="M 80,240 A 170,170 0 0,1 420,240" fill="none" />
    <!-- Bottom Arc: right to left under the bottom (for upright text) -->
    <path id="bottomArcPath" d="M 410,260 A 170,170 0 0,1 90,260" fill="none" />
  </defs>

  <!-- Background Circle (delicate shadow) -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.15" />

  <!-- Outer Double Rings -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#logoGrad)" stroke-width="6" />
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.7" />

  <!-- The 3 Stars below top text -->
  <g fill="url(#logoGrad)">
    <polygon points="250,95 253,101 260,101 255,106 257,112 250,108 243,112 245,106 240,101 247,101" />
    <polygon points="225,102 227,107 233,107 228,111 230,117 225,113 220,117 222,111 217,107 223,107" transform="rotate(-15, 225, 107)" />
    <polygon points="275,102 277,107 283,107 278,111 280,117 275,113 270,117 272,111 267,107 273,107" transform="rotate(15, 275, 107)" />
  </g>

  <!-- Year: 20  25 -->
  <text x="95" y="260" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="url(#logoGrad)" letter-spacing="1">20</text>
  <text x="375" y="260" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="url(#logoGrad)" letter-spacing="1">25</text>

  <!-- Curved Texts -->
  <!-- Top Text: SAUL'S PODSHIP -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-weight="950" font-size="34" fill="url(#logoGrad)" letter-spacing="4">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">SAUL'S PODSHIP</textPath>
  </text>

  <!-- Bottom Text: WORSHIP & PODCAST -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="23" fill="url(#logoGrad)" letter-spacing="6">
    <textPath href="#bottomArcPath" startOffset="50%" text-anchor="middle">WORSHIP &amp; PODCAST</textPath>
  </text>

  <!-- Center Artwork (Classic Mic & Headset) -->
  <g transform="translate(145, 155)">
    <!-- Headphones - Arch/Band -->
    <path d="M 12.5,100 A 90,90 0 0,1 192.5,100" fill="none" stroke="url(#logoGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Headphones Earcups -->
    <!-- Left Cup -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="30" height="50" rx="15" fill="url(#logoGrad)" />
      <rect x="25" y="10" width="7" height="30" rx="3" fill="#ffffff" opacity="0.3" />
      <path d="M 15,-20 L 15,0" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" />
    </g>
    <!-- Right Cup -->
    <g transform="translate(175, 75)">
      <rect x="0" y="0" width="30" height="50" rx="15" fill="url(#logoGrad)" />
      <rect x="-2" y="10" width="7" height="30" rx="3" fill="#ffffff" opacity="0.3" />
      <path d="M 15,-20 L 15,0" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Vintage Microphone -->
    <!-- Stand Neck & Base -->
    <rect x="99" y="125" width="12" height="45" rx="4" fill="url(#logoGrad)" />
    <path d="M 60,165 L 150,165" stroke="url(#logoGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 68,162 A 40,40 0 0,0 137,162" fill="none" stroke="url(#logoGrad)" stroke-width="8" />

    <!-- U-Shape Mount around the mic -->
    <path d="M 62,65 A 43,43 0 0,0 148,65" fill="none" stroke="url(#logoGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Connector pins of Mount -->
    <line x1="58" y1="65" x2="68" y2="65" stroke="url(#logoGrad)" stroke-width="6" />
    <line x1="137" y1="65" x2="147" y2="65" stroke="url(#logoGrad)" stroke-width="6" />

    <!-- Mic Main Body & Capsule -->
    <rect x="78" y="20" width="49" height="70" rx="24" fill="url(#logoGrad)" />
    <!-- Grill inner White/Glow area -->
    <rect x="83" y="24" width="39" height="38" rx="18" fill="#1D2D50" opacity="0.75" />
    
    <!-- Microphone Grill Inner Lines -->
    <g stroke="url(#logoGrad)" stroke-width="2.5">
      <!-- Horizontal lines -->
      <line x1="84" y1="31" x2="121" y2="31" />
      <line x1="82" y1="38" x2="123" y2="38" />
      <line x1="82" y1="45" x2="123" y2="45" />
      <line x1="84" y1="52" x2="121" y2="52" />
      <line x1="88" y1="59" x2="117" y2="59" />
      <!-- Vertical mesh lines -->
      <line x1="91" y1="26" x2="91" y2="61" />
      <line x1="97" y1="24" x2="97" y2="63" />
      <line x1="102" y1="24" x2="102" y2="63" />
      <line x1="108" y1="24" x2="108" y2="63" />
      <line x1="114" y1="26" x2="114" y2="61" />
    </g>

    <!-- Sleek Horizontal Band Separator -->
    <rect x="76" y="62" width="53" height="8" rx="2" fill="url(#logoGrad)" stroke="#1D2D50" stroke-width="1.5" />
    <!-- Metallic Highlights -->
    <rect x="85" y="64" width="35" height="4" rx="1" fill="#ffffff" opacity="0.4" />
  </g>
</svg>

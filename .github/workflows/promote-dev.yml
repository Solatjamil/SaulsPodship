name: Promote dev to main (daily)

# Caps production deployments (each stores a full ~95 MB build copy in Vercel
# Deployment Storage) to ONE per day: work lands on `dev`, and this workflow
# catches dev up with main, build-checks the merged tree, then fast-forwards
# main to dev. Emergency fixes may still push straight to main.
#
# On merge conflict the run aborts loudly (resolve on dev, re-run).

on:
  schedule:
    - cron: "15 12 * * *"   # 17:15 Pakistan time, daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-dev-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Catch dev up with main
        run: |
          git config user.name "promote-bot"
          git config user.email "111325113+Solatjamil@users.noreply.github.com"
          if git diff --quiet HEAD origin/main; then
            echo "NO_CHANGES: dev and main identical"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git merge origin/main --no-edit || { echo "::error::Merge conflict between dev and main - resolve on dev, then re-run."; git merge --abort; exit 1; }

      - name: Build check (merged tree)
        if: env.skip != 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Push dev -> main (fast-forward) and update dev
        if: env.skip != 'true'
        run: |
          git push origin HEAD:refs/heads/main
          git push origin dev
